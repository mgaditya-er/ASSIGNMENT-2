<div class="container mt-4">
  <form [formGroup]="patientForm" (ngSubmit)="onSubmit()">
    <div class="row">
      <!-- First Column (Left) -->
      <div class="col-md-6">
        <div class="mb-3">
          <label for="name" class="form-label">Name:</label>
          <input 
            id="name" 
            formControlName="name" 
            class="form-control" 
            type="text">
          <div *ngIf="patientForm.controls['name'].touched && patientForm.controls['name'].invalid" class="text-danger">
            <small *ngIf="patientForm.controls['name'].hasError('required')">Name is required.</small>
          </div>
        </div>

        <div class="mb-3">
          <label for="dob" class="form-label">Date of Birth:</label>
          <input 
            id="dob" 
            formControlName="dob" 
            class="form-control" 
            type="date">
          <div *ngIf="patientForm.controls['dob'].touched && patientForm.controls['dob'].invalid"
            class="text-danger">
            <small *ngIf="patientForm.controls['dob'].hasError('required')">Date of birth is required.</small>
          </div>
        </div>

        <div class="mb-3">
          <label for="gender" class="form-label">Gender:</label>
          <select 
            id="gender" 
            formControlName="gender" 
            class="form-select">
            <option value="">Select Gender</option>
            <option *ngFor="let option of genderOptions" [value]="option">{{ option }}</option>
          </select>
          <div *ngIf="patientForm.controls['gender'].touched && patientForm.controls['gender'].invalid"
            class="text-danger">
            <small *ngIf="patientForm.controls['gender'].hasError('required')">Gender is required.</small>
          </div>
        </div>
      </div>

      <!-- Second Column (Right) -->
      <div class="col-md-6">
        <div class="mb-3">
          <label for="age" class="form-label">Age:</label>
          <input 
            id="age" 
            formControlName="age" 
            class="form-control" 
            type="number" 
            min="0">
          <div *ngIf="patientForm.controls['age'].touched && patientForm.controls['age'].invalid"
            class="text-danger">
            <small *ngIf="patientForm.controls['age'].hasError('required')">Age is required.</small>
            <small *ngIf="patientForm.controls['age'].hasError('min')">Age cannot be negative.</small>
          </div>
        </div>

        <div class="mb-3">
          <label for="contactNumber" class="form-label">Contact Number:</label>
          <input 
            id="contactNumber" 
            formControlName="contactNumber" 
            class="form-control" 
            type="text">
          <div *ngIf="patientForm.controls['contactNumber'].touched && patientForm.controls['contactNumber'].invalid"
            class="text-danger">
            <small *ngIf="patientForm.controls['contactNumber'].hasError('required')">Contact number is required.</small>
            <small *ngIf="patientForm.controls['contactNumber'].hasError('pattern')">Contact number must be a valid 10-digit number.</small>
          </div>
        </div>

        <div class="mb-3">
          <label for="address" class="form-label">Address:</label>
          <input 
            id="address" 
            formControlName="address" 
            class="form-control" 
            type="text">
          <div *ngIf="patientForm.controls['address'].touched && patientForm.controls['address'].invalid"
            class="text-danger">
            <small *ngIf="patientForm.controls['address'].hasError('required')">Address is required.</small>
          </div>
        </div>

        <div class="mb-3">
          <label for="medicalHistory" class="form-label">Medical History:</label>
          <textarea 
            id="medicalHistory" 
            formControlName="medicalHistory" 
            class="form-control"></textarea>
          <div *ngIf="patientForm.controls['medicalHistory'].touched && patientForm.controls['medicalHistory'].invalid"
            class="text-danger">
            <small *ngIf="patientForm.controls['medicalHistory'].hasError('required')">Medical History is required.</small>
          </div>
        </div>
      </div>
    </div>

    <div class="text-center mt-3">
      <button type="submit" class="btn btn-primary" [disabled]="patientForm.invalid">Submit</button>
    </div>
  </form>
</div>
